set -g @kanagawa_bg '#181616'
set -g @kanagawa_bg_dark '#0d0c0c'
set -g @kanagawa_bg_dim '#12120f'
set -g @kanagawa_bg_highlight '#2d4f67'
set -g @kanagawa_fg '#c5c9c5'
set -g @kanagawa_fg_dim '#c8c093'
set -g @kanagawa_red '#c4746e'
set -g @kanagawa_red_bright '#e46876'
set -g @kanagawa_green '#8a9a7b'
set -g @kanagawa_green_bright '#87a987'
set -g @kanagawa_yellow '#c4b28a'
set -g @kanagawa_yellow_bright '#e6c384'
set -g @kanagawa_blue '#8ba4b0'
set -g @kanagawa_blue_bright '#7fb4ca'
set -g @kanagawa_purple '#a292a3'
set -g @kanagawa_cyan '#8ea4a2'
set -g @kanagawa_cyan_bright '#7aa89f'
set -g @kanagawa_grey '#a6a69c'

set -g status on
set -g status-interval 2
set -g status-style "fg=#{@kanagawa_grey},bg=#{@kanagawa_bg}"
set -g status-left-style "fg=#{@kanagawa_grey},bg=#{@kanagawa_bg}"
set -g status-right-style "fg=#{@kanagawa_grey},bg=#{@kanagawa_bg}"
set -g message-style "fg=#{@kanagawa_red_bright},bg=#{@kanagawa_bg}"
set -g message-command-style "fg=#{@kanagawa_fg},bg=#{@kanagawa_bg_highlight}"
set -g mode-style "fg=#{@kanagawa_fg},bg=#{@kanagawa_bg_highlight}"
setw -g window-status-style "fg=#{@kanagawa_grey},bg=#{@kanagawa_bg}"
setw -g window-status-activity-style "fg=#{@kanagawa_yellow_bright},bg=#{@kanagawa_bg}"
setw -g window-status-current-style "fg=#{@kanagawa_fg},bg=#{@kanagawa_bg_highlight},bold"
set -g pane-border-style "fg=#{@kanagawa_bg_highlight}"
set -g pane-active-border-style "fg=#{@kanagawa_blue_bright}"
set -g display-panes-active-colour '#7fb4ca'
set -g display-panes-colour '#e6c384'
set -g clock-mode-colour '#7fb4ca'
set -g window-status-bell-style "fg=#{@kanagawa_bg_dark},bg=#{@kanagawa_red_bright}"

set -g status-left-length 60
set -g status-right-length 150
set -g status-left "#[fg=#{@kanagawa_yellow_bright},bg=#{@kanagawa_bg},bold] #S #[fg=#{@kanagawa_bg_highlight},nobold]|#[fg=#{@kanagawa_grey}] #(whoami) "
set -g status-right "#[fg=#{@kanagawa_grey},bg=#{@kanagawa_bg}] %Y-%m-%d %H:%M #[fg=#{@kanagawa_bg_highlight}]|#[fg=#{@kanagawa_cyan_bright},bold] #h "
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@kanagawa_grey},bg=#{@kanagawa_bg}] #I:#W "
set -g window-status-current-format "#[fg=#{@kanagawa_fg},bg=#{@kanagawa_bg_highlight},bold] #I:#W "
